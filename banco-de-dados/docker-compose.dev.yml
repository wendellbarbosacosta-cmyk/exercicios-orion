version: '3.8'

services:
  db_postgres:
    image: postgres:16-alpine
    container_name: orion_postgres_dev
    environment:
      POSTGRES_USER: orion_user
      POSTGRES_PASSWORD: orion_password
      POSTGRES_DB: orion_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - orion_network_dev

  db_mongo:
    image: mongo:latest
    container_name: orion_mongo_dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: orion_admin
      MONGO_INITDB_ROOT_PASSWORD: orion_admin_pass
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db
    networks:
      - orion_network_dev

volumes:
  postgres_data_dev:
    driver: local
  mongo_data_dev:
    driver: local

networks:
  orion_network_dev:
    driver: bridge