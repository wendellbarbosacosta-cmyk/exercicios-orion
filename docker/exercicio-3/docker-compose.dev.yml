name: exercicio3-dev
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - orion_db_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ./api
      target: dev       # Aponta especificamente para o estágio DEV do Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./api:/app      # Monta o volume para permitir o Live Reload do Uvicorn
    depends_on:
      - db

volumes:
  orion_db_data_dev: