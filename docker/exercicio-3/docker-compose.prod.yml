version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - orion_db_data_prod:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ./api
      target: prod      # Aponta para o estágio PROD (imagem final otimizada)
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  orion_db_data_prod: